info:
  name: 02-CRUD
  type: http
  seq: 1

http:
  method: POST
  url: https://jsonplaceholder.typicode.com/posts
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "title": "My first post",
        "body": "Learning REST with Bruno",
        "userId": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
