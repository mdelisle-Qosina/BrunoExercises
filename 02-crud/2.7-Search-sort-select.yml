info:
  name: 2.7-Search-sort-select
  type: http
  seq: 4

http:
  method: GET
  url: https://dummyjson.com/products/search?q=phone&sortBy=price&order=desc&select=title,price
  params:
    - name: q
      value: phone
      type: query
    - name: sortBy
      value: price
      type: query
    - name: order
      value: desc
      type: query
    - name: select
      value: title,price
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
